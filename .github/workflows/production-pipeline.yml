name: Production Pipeline

on:
  push:
    branches:
      - main
      - staging

jobs:
  # ---------------------------------------------------------
  # GATE 1: Supply Chain & Security
  # ---------------------------------------------------------
  security-scan:
    name: Security & Supply Chain Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: pnpm audit
        run: pnpm audit --prod

  # ---------------------------------------------------------
  # GATE 2: Build & Typecheck
  # ---------------------------------------------------------
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build All
        run: pnpm -r build

  # ---------------------------------------------------------
  # GATE 3: Regression & E2E Validation
  # ---------------------------------------------------------
  test:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Unit & E2E Tests
        run: pnpm -r test
      
  # ---------------------------------------------------------
  # STAGING: Deploy Backend (AWS ECS Fargate)
  # ---------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging'
    needs: test
    steps:
      - uses: actions/checkout@v4
      # Placeholder: Build Docker Image, Push to ECR, Update ECS Service
      - name: Deploy to AWS ECS Staging
        run: echo "Deploying to Staging AWS ECS..."

  # ---------------------------------------------------------
  # PRODUCTION: Deploy Backend & Desktop
  # ---------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: test
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to AWS ECS Production
        run: echo "Deploying to Production AWS ECS..."
      - name: Build & Publish Electron (Windows/Mac)
        env:
          WIN_CSC_SHA1: ${{ secrets.WIN_CSC_SHA1 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile
          pnpm --filter @peep/desktop run build
          # electron-builder will publish to GitHub Releases
          npx electron-builder --win --mac --publish always
